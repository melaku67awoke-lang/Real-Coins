name: Build RealCoin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find and extract RealCoin ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: RealCoin ZIP was not found."
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted"
          PROJECT=$(find "$GITHUB_WORKSPACE/extracted" -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project was not found inside ZIP."
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.1.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build RealCoin debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          set -euo pipefail
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
