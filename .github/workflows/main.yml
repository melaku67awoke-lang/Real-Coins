name: Build RealCoin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find and extract RealCoin ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: RealCoin ZIP was not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

          PROJECT=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "settings.gradle.kts" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project was not found inside ZIP."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          if [ -z "$SDK" ]; then
            SDK="/usr/local/lib/android/sdk"
          fi

          echo "Android SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -name sdkmanager \
            -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.1.0"

      - name: Prepare Gradle configuration
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          touch gradle.properties

          if grep -q '^android.disallowKotlinSourceSets=' gradle.properties; then
            sed -i \
              's/^android\.disallowKotlinSourceSets=.*/android.disallowKotlinSourceSets=false/' \
              gradle.properties
          else
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          fi

          echo "===== gradle.properties ====="
          cat gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build RealCoin APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "===== Gradle version ====="
          gradle --version

          echo "===== Building RealCoin Debug APK ====="

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Pandroid.disallowKotlinSourceSets=false

      - name: Verify APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "===== Generated APK files ====="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "SUCCESS: APK generated:"
          echo "$APK"

      - name: Upload RealCoin APK
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
