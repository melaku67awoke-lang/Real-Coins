name: Unzip RealCoin Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          set -e

          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Unzip the uploaded project
        run: |
          set -e

          test -f Real-Coins-step28-d1-configured.zip

          rm -rf _realcoin_extract
          mkdir _realcoin_extract

          unzip -o Real-Coins-step28-d1-configured.zip -d _realcoin_extract

          # Never overwrite GitHub Actions workflows
          rm -rf _realcoin_extract/.github/workflows

          # Copy the RealCoin project into the repository
          cp -a _realcoin_extract/. .

          # Clean temporary files
          rm -rf _realcoin_extract
          rm -f Real-Coins-step28-d1-configured.zip

      - name: Commit extracted project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Restore RealCoin project files from Step 28 ZIP"

      - name: Push extracted project
        run: |
          set -e
          git push origin HEAD:main
