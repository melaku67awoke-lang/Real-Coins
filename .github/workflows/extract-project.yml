name: Extract RealCoin Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find RealCoin ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract RealCoin ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          rm -rf extracted-realcoin
          mkdir -p extracted-realcoin

          unzip -q "$ZIP_FILE" -d extracted-realcoin

          echo "Extraction completed."

          echo "===== Extracted project ====="
          find extracted-realcoin -maxdepth 3 -type f | sort | head -200

      - name: Copy Android project to repository root
        shell: bash
        run: |
          set -e

          TOP_LEVEL_COUNT=$(find extracted-realcoin \
            -mindepth 1 \
            -maxdepth 1 \
            | wc -l)

          if [ "$TOP_LEVEL_COUNT" -eq 1 ] && \
             [ -d "$(find extracted-realcoin \
             -mindepth 1 \
             -maxdepth 1 \
             -type d \
             | head -n 1)" ]; then

            PROJECT_DIR="$(find extracted-realcoin \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | head -n 1)"

            echo "Project directory detected:"
            echo "$PROJECT_DIR"

            rsync -a \
              --exclude='.git/' \
              --exclude='.github/workflows/' \
              "$PROJECT_DIR/" ./

          else

            echo "Project files are directly inside ZIP."

            rsync -a \
              --exclude='.git/' \
              --exclude='.github/workflows/' \
              extracted-realcoin/ ./

          fi

      - name: Remove ZIP and temporary files
        shell: bash
        run: |
          set -e

          rm -rf extracted-realcoin

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          if [ -f "$ZIP_FILE" ]; then
            rm -f "$ZIP_FILE"
          fi

      - name: Verify workflow files were not changed
        shell: bash
        run: |
          set -e

          echo "===== Workflow files in repository ====="

          find .github/workflows \
            -maxdepth 1 \
            -type f \
            -print 2>/dev/null || true

          echo ""
          echo "===== Workflow changes ====="

          git status --short .github/workflows || true

      - name: Show changes
        shell: bash
        run: |
          echo "===== Git status ====="
          git status --short

          echo ""
          echo "===== Git diff summary ====="
          git diff --stat

          echo ""
          echo "===== Files that will be committed ====="
          git status --short

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo "===== Staged files ====="
          git diff --cached --name-only

          echo ""
          echo "===== Checking for workflow modifications ====="

          if git diff --cached --name-only | grep -E '^\.github/workflows/' ; then
            echo "ERROR: Workflow files are being modified."
            echo "The extraction workflow intentionally does not modify workflow files."
            exit 1
          fi

          git commit -m "Extract RealCoin v30 Android project"

      - name: Synchronize with remote main
        shell: bash
        run: |
          set -e

          git fetch origin main

          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Local branch is behind or equal to remote."
          else
            echo "Rebasing local commit(s) on latest remote main..."
            git rebase origin/main
          fi

      - name: Push changes
        shell: bash
        run: |
          set -e

          echo "Pushing extracted Android project..."

          git push origin HEAD:main

          echo "Push successful."

      - name: Final status
        shell: bash
        run: |
          echo "===== Final commit ====="
          git log -1 --oneline

          echo ""
          echo "===== Final status ====="
          git status --short

          echo ""
          echo "===== Android project files ====="

          test -f settings.gradle.kts && \
            echo "OK: settings.gradle.kts"

          test -f build.gradle.kts && \
            echo "OK: build.gradle.kts"

          test -f app/build.gradle.kts && \
            echo "OK: app/build.gradle.kts"

          echo ""
          echo "RealCoin extraction completed."
