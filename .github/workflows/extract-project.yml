name: Extract RealCoin Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract RealCoin ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'RealCoin_AndroidStudio_CLOUD*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RealCoin ZIP file was not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted-realcoin
          mkdir -p extracted-realcoin

          unzip -q "$ZIP_FILE" -d extracted-realcoin

          PROJECT_DIR=$(find extracted-realcoin \
            -type f \
            -name 'settings.gradle.kts' \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root was not found."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"

          echo "Copying Android project..."

          rsync -a \
            --exclude='.github/' \
            "$PROJECT_DIR"/ ./

          echo "Android project extracted successfully."

      - name: Remove temporary files
        run: |
          rm -rf extracted-realcoin
          rm -f RealCoin_AndroidStudio_CLOUD*.zip

      - name: Commit extracted project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- ':!.github'

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          git commit -m "Extract RealCoin v30 Android project"

          echo "Updating local branch from origin/main..."

          git pull --rebase origin main

          echo "Pushing extracted project..."

          git push origin main
