name: Extract RealCoin Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find RealCoin ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract RealCoin ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          rm -rf extracted-realcoin
          mkdir -p extracted-realcoin

          unzip -q "$ZIP_FILE" -d extracted-realcoin

          echo "Extraction completed."
          echo "Extracted files:"
          find extracted-realcoin -maxdepth 3 -type f | head -100

      - name: Copy Android project to repository root
        shell: bash
        run: |
          set -e

          # Detect whether the ZIP contains one top-level directory
          # or the Android project directly.
          TOP_LEVEL_COUNT=$(find extracted-realcoin -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$TOP_LEVEL_COUNT" -eq 1 ] && \
             [ -d "$(find extracted-realcoin -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then

            PROJECT_DIR="$(find extracted-realcoin -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            echo "Project directory detected: $PROJECT_DIR"

            rsync -a \
              --exclude='.git/' \
              "$PROJECT_DIR/" ./

          else

            echo "Project files are directly inside ZIP."

            rsync -a \
              --exclude='.git/' \
              extracted-realcoin/ ./

          fi

      - name: Remove ZIP and temporary extraction directory
        shell: bash
        run: |
          rm -rf extracted-realcoin

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          if [ -f "$ZIP_FILE" ]; then
            rm -f "$ZIP_FILE"
          fi

      - name: Protect workflow file
        shell: bash
        run: |
          # Make sure extracting the ZIP cannot accidentally replace
          # this workflow with another version.
          git checkout -- .github/workflows/extract-project.yml 2>/dev/null || true

      - name: Show changes
        shell: bash
        run: |
          echo "===== Git status ====="
          git status --short

          echo "===== Git diff summary ====="
          git diff --stat

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract RealCoin v30 Android project"

      - name: Synchronize with remote main
        shell: bash
        run: |
          set -e

          git fetch origin main

          # Rebase our new commit on top of the latest remote main.
          git rebase origin/main

      - name: Push changes
        shell: bash
        run: |
          set -e

          # Push with retry protection in case another commit reaches
          # main between fetch/rebase and push.
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push rejected. Synchronizing with remote again..."

              git fetch origin main
              git rebase origin/main
            fi
          done

          echo "ERROR: Could not push after 3 attempts."
          exit 1

      - name: Final status
        shell: bash
        run: |
          echo "===== Final commit ====="
          git log -1 --oneline

          echo "===== Final status ====="
          git status --short
