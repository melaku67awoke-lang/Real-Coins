name: Extract RealCoin Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RealCoin ZIP
        run: |
          rm -rf extracted-realcoin
          mkdir extracted-realcoin

          unzip -q RealCoin_AndroidStudio_CLOUD*.zip -d extracted-realcoin

          PROJECT_DIR=$(find extracted-realcoin -type f -name "settings.gradle.kts" -print -quit | xargs dirname)

          echo "Project directory: $PROJECT_DIR"

          # Copy the Android project but NEVER copy GitHub workflow files
          rsync -a \
            --exclude='.github/' \
            "$PROJECT_DIR"/ ./

          rm -rf extracted-realcoin

      - name: Remove ZIP
        run: |
          rm -f RealCoin_AndroidStudio_CLOUD*.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- ':!.github'

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          git commit -m "Extract RealCoin Android project"
          git push
