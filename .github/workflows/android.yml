name: RealCoin Android Build & Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test RealCoin v30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Java and Android environment
        run: |
          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          adb version

          echo "=== Project ==="
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project detected successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Check Gradle project
        run: |
          gradle --no-daemon tasks

      - name: Run unit tests
        run: |
          gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify debug APK
        run: |
          echo "=== Searching for APK ==="

          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-v30-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-v30-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Final verification
        run: |
          echo "=========================================="
          echo "RealCoin v30 BUILD/TEST WORKFLOW COMPLETE"
          echo "=========================================="

          echo "Project files:"
          test -f settings.gradle.kts && echo "OK: settings.gradle.kts"
          test -f build.gradle.kts && echo "OK: build.gradle.kts"
          test -f app/build.gradle.kts && echo "OK: app/build.gradle.kts"

          echo ""
          echo "APK:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -exec ls -lh {} \;

          echo ""
          echo "All required workflow stages completed."
