name: RealCoin Android Build & Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test RealCoin v30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version
          adb version
          sdkmanager --version

      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project structure OK."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Check Gradle project
        run: |
          gradle --no-daemon tasks

      - name: Run unit tests
        run: |
          gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify debug APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "=========================================="
          echo "DEBUG APK GENERATED SUCCESSFULLY"
          echo "=========================================="
          echo "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-v30-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-v30-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Final verification
        run: |
          echo "=========================================="
          echo "RealCoin v30 BUILD/TEST COMPLETE"
          echo "=========================================="

          echo "Unit tests: PASSED"
          echo "Debug build: PASSED"
          echo "APK: GENERATED"

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;
