name: Build and Test RealCoin v30

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test RealCoin v30
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2. Java
      # JDK 21 is used for Robolectric compatibility.
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ------------------------------------------------------------
      # 3. Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ------------------------------------------------------------
      # 4. Install Android SDK packages
      # ------------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ------------------------------------------------------------
      # 5. Verify Android environment
      # ------------------------------------------------------------
      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed

      # ------------------------------------------------------------
      # 6. Verify Android project
      # ------------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project files found."

          echo ""
          echo "Project structure:"
          find app/src -maxdepth 3 -type f | sort | head -100

      # ------------------------------------------------------------
      # 7. Set up Gradle 9.3.1
      # Required by Android Gradle Plugin 9.1.1.
      # ------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # ------------------------------------------------------------
      # 8. Verify Gradle
      # ------------------------------------------------------------
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

      # ------------------------------------------------------------
      # 9. Check Gradle project
      # ------------------------------------------------------------
      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          gradle --no-daemon \
            --stacktrace \
            tasks

      # ------------------------------------------------------------
      # 10. Run unit tests
      #
      # IMPORTANT:
      # Do not skip failing tests.
      # Do not use || true.
      # The
