name: Build and Test RealCoin v30

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test RealCoin v30
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_VERSION: "9.3.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # JAVA 21
      # Required by Robolectric when testing Android SDK 36
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify JDK
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          java -version
          which javac
          javac -version

      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------
      - name: Detect Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "Android SDK directory not found"
            exit 1
          fi

          ls -la "$ANDROID_SDK_ROOT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "=== adb ==="
          adb version

          echo "=== SDK platforms ==="
          sdkmanager --list_installed | grep "platforms;android-36" || true

          echo "=== Build tools ==="
          sdkmanager --list_installed | grep "build-tools;36.0.0" || true

      # ------------------------------------------------------------
      # VERIFY PROJECT
      # ------------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

          echo "Android project files found."

          echo "=== Project structure ==="
          find app/src -maxdepth 4 -type f | sort | head -200

      # ------------------------------------------------------------
      # GRADLE 9.3.1
      # AGP 9.1.1 requires Gradle 9.3.1+
      # ------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle and Java
        shell: bash
        run: |
          set -e

          echo "=== Java ==="
          java -version

          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"

          echo "=== Gradle ==="
          gradle --version

      # ------------------------------------------------------------
      # IMPORTANT:
      # Explicitly force Gradle to use the JDK 21 installed above.
      # This prevents Robolectric SDK 36 from accidentally running
      # on another Java version.
      # ------------------------------------------------------------
      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            tasks --all

      # ------------------------------------------------------------
      # UNIT TESTS
      # ------------------------------------------------------------
      - name: Run unit tests
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "JAVA USED BY TESTS"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          echo "========================================"
          echo "GRADLE JVM"
          echo "========================================"

          gradle --version

          echo "========================================"
          echo "RUNNING ROBOLECTRIC UNIT TESTS"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            testDebugUnitTest

      # ------------------------------------------------------------
      # BUILD DEBUG APK
      # Only runs if all unit tests pass.
      # ------------------------------------------------------------
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            assembleDebug

      # ------------------------------------------------------------
      # VERIFY APK
      # ------------------------------------------------------------
      - name: Verify debug APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "APK size:"
          du -h "$APK"

      # ------------------------------------------------------------
      # UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-v30-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # UPLOAD TEST REPORTS
      # ------------------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-v30-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
