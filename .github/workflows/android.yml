name: Build and Test RealCoin v30

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test RealCoin v30
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "9.3.1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Java
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Detect Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory does not exist."
            exit 1
          fi

          echo "Android SDK found:"
          ls -la "$ANDROID_SDK_ROOT"

          echo ""
          echo "Searching for sdkmanager..."

          SDKMANAGER=""
          for candidate in \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager found at:"
          echo "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -e

          echo "Using:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version
          adb version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --list_installed

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Android SDK 36 and Build Tools 36.0.0 are installed."

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Android project files found."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            tasks --all

      - name: Run unit tests
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "Debug APK successfully generated:"
          ls -lh "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-v30-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealCoin-v30-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
