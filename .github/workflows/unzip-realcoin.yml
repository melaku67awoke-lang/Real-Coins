name: Unzip Real-Coins Final Master

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip final master
        run: |
          set -e

          ZIP_FILE="Real-Coins-FINAL-MASTER.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            exit 1
          fi

          mkdir -p /tmp/realcoins
          unzip -o "$ZIP_FILE" -d /tmp/realcoins

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='Real-Coins-FINAL-MASTER.zip' \
            /tmp/realcoins/ ./

          rm -f "$ZIP_FILE"

      - name: Commit unzipped project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unzip Real-Coins final master"
            git push
          fi
